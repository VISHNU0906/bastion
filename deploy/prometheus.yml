# Prometheus config for the Bastion demo stack.
# Scrapes the Bastion exporter and loads the generated security-SLO rules.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  # The recording + alerting rules generated by `bastion generate`. The
  # generator output is mounted into /etc/prometheus/rules (see docker-compose).
  - /etc/prometheus/rules/bastion_security_rules.yaml

scrape_configs:
  - job_name: bastion
    metrics_path: /metrics
    static_configs:
      - targets: ["bastion:9300"]
        labels:
          service: bastion

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
