      - alert: SecuritySLOBurn_auth_failure_ratio_1h_Fast
        expr: "securityslo:auth_failure_ratio:error_ratio_rate1h > 0.144 and securityslo:auth_failure_ratio:error_ratio_rate5m > 0.144"
        for: 2m
