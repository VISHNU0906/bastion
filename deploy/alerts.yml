      # objective 99.0% over 30d, error budget = 0.01
      # ====================================================================
      # --- Recording rules: error ratio per window ---
      - record: securityslo:auth_failure_ratio:error_ratio_rate5m
        expr: "sum(rate(bastion_auth_failures_total[5m])) / sum(rate(bastion_auth_attempts_total[5m]))"
        labels:
          slo: "auth_failure_ratio"
          window: "5m"
          sli_type: "ratio"
      - record: securityslo:auth_failure_ratio:error_ratio_rate30m
        expr: "sum(rate(bastion_auth_failures_total[30m])) / sum(rate(bastion_auth_attempts_total[30m]))"
