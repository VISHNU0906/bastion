          description: "Over the last 3d (confirmed by the last 6h) the error ratio for Auth Failure Ratio exceeded 0.01 (= 1x the 0.01 budget). At this rate ~10% of the 30d budget burns over the long window."
          runbook: "Investigate the Auth Failure Ratio security SLO. Bastion opens an incident on breach; follow the linked runbook."
      # ====================================================================
      # SLO: Critical CVE Age -- sli_type threshold
      # No critical/high dependency CVE remains unpatched for more than 7 days.
      # threshold invariant (no error budget): alerts when the limit is breached
      # ====================================================================
      - alert: SecurityInvariant_critical_cve_age
        expr: "bastion_dependency_critical_over_age > 0"
        for: 2m
        labels:
          severity: "page"
          slo: "critical_cve_age"
          team: "security"
        annotations:
          summary: "Security invariant breached: Critical CVE Age"
          description: "The hard security invariant for Critical CVE Age is breached: bastion_dependency_critical_over_age > 0. There is no error budget for this SLO; it must be zero."
          runbook: "Investigate the Critical CVE Age invariant immediately. Bastion opens an incident on breach."
      # ====================================================================
      # SLO: Detection MTTD -- sli_type latency_ratio
      # 99% of critical runtime-security detections are detected within 5 minutes.
      # objective 99.0% over 30d, error budget = 0.01
      # ====================================================================
      # --- Recording rules: error ratio per window ---
      - record: securityslo:detection_mttd:error_ratio_rate5m
        expr: "1 - (sum(rate(bastion_detection_latency_seconds_bucket{le=\"300.0\",priority=\"Critical\"}[5m])) / sum(rate(bastion_detection_latency_seconds_count{priority=\"Critical\"}[5m])))"
