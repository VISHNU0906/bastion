        for: 15m
        labels:
          severity: "ticket"
          slo: "certificate_freshness"
          team: "security"
          burn_rate: "3"
        annotations:
          summary: "Security SLO burn: Certificate Freshness is burning error budget 3x"
          description: "Over the last 24h (confirmed by the last 2h) the error ratio for Certificate Freshness exceeded 0.003 (= 3x the 0.001 budget). At this rate ~10% of the 30d budget burns over the long window."
          runbook: "Investigate the Certificate Freshness security SLO. Bastion opens an incident on breach; follow the linked runbook."
      - alert: SecuritySLOBurn_certificate_freshness_3d_Slow
        expr: "securityslo:certificate_freshness:error_ratio_rate3d > 0.001 and securityslo:certificate_freshness:error_ratio_rate6h > 0.001"
