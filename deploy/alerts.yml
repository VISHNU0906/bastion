          description: "Over the last 1h (confirmed by the last 5m) the error ratio for Auth Failure Ratio exceeded 0.144 (= 14.4x the 0.01 budget). At this rate ~2% of the 30d budget burns over the long window."
          runbook: "Investigate the Auth Failure Ratio security SLO. Bastion opens an incident on breach; follow the linked runbook."
      - alert: SecuritySLOBurn_auth_failure_ratio_6h_Fast
        expr: "securityslo:auth_failure_ratio:error_ratio_rate6h > 0.06 and securityslo:auth_failure_ratio:error_ratio_rate30m > 0.06"
        for: 2m
        labels:
          severity: "page"
          slo: "auth_failure_ratio"
          team: "security"
          burn_rate: "6"
        annotations:
          summary: "Security SLO burn: Auth Failure Ratio is burning error budget 6x"
          description: "Over the last 6h (confirmed by the last 30m) the error ratio for Auth Failure Ratio exceeded 0.06 (= 6x the 0.01 budget). At this rate ~5% of the 30d budget burns over the long window."
          runbook: "Investigate the Auth Failure Ratio security SLO. Bastion opens an incident on breach; follow the linked runbook."
      - alert: SecuritySLOBurn_auth_failure_ratio_24h_Slow
        expr: "securityslo:auth_failure_ratio:error_ratio_rate24h > 0.03 and securityslo:auth_failure_ratio:error_ratio_rate2h > 0.03"
        for: 15m
        labels:
          severity: "ticket"
          slo: "auth_failure_ratio"
          team: "security"
          burn_rate: "3"
        annotations:
          summary: "Security SLO burn: Auth Failure Ratio is burning error budget 3x"
          description: "Over the last 24h (confirmed by the last 2h) the error ratio for Auth Failure Ratio exceeded 0.03 (= 3x the 0.01 budget). At this rate ~10% of the 30d budget burns over the long window."
