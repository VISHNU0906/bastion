# Committed SNAPSHOT of `bastion generate -f slos.example.yaml` for reference and
# review. The docker-compose stack regenerates this fresh into a shared volume
# (the rule-gen service) so Prometheus always loads up-to-date rules; this file
# is here so you can read the generated rules without running anything.
# Generated by Bastion (https://github.com/VISHNU0906/bastion) -- DO NOT EDIT BY HAND.
# Security SLOs: multi-window multi-burn-rate (Google SRE Workbook) + threshold invariants.
groups:
  - name: bastion_security_slos
    rules:
      # ====================================================================
      # SLO: Certificate Freshness -- sli_type freshness
      # 99.9% of monitored TLS certificates have more than 14 days until expiry.
      # objective 99.9% over 30d, error budget = 0.001
      # ====================================================================
      # --- Recording rules: error ratio per window ---
      - record: securityslo:certificate_freshness:error_ratio_rate5m
        expr: "1 - (avg(avg_over_time(bastion_tls_cert_valid[5m])))"
        labels:
          slo: "certificate_freshness"
          window: "5m"
          sli_type: "freshness"
      - record: securityslo:certificate_freshness:error_ratio_rate30m
        expr: "1 - (avg(avg_over_time(bastion_tls_cert_valid[30m])))"
        labels:
          slo: "certificate_freshness"
          window: "30m"
          sli_type: "freshness"
      - record: securityslo:certificate_freshness:error_ratio_rate1h
        expr: "1 - (avg(avg_over_time(bastion_tls_cert_valid[1h])))"
        labels:
          slo: "certificate_freshness"
          window: "1h"
          sli_type: "freshness"
      - record: securityslo:certificate_freshness:error_ratio_rate2h
        expr: "1 - (avg(avg_over_time(bastion_tls_cert_valid[2h])))"
        labels:
          slo: "certificate_freshness"
          window: "2h"
          sli_type: "freshness"
      - record: securityslo:certificate_freshness:error_ratio_rate6h
        expr: "1 - (avg(avg_over_time(bastion_tls_cert_valid[6h])))"
        labels:
          slo: "certificate_freshness"
          window: "6h"
          sli_type: "freshness"
      - record: securityslo:certificate_freshness:error_ratio_rate24h
        expr: "1 - (avg(avg_over_time(bastion_tls_cert_valid[24h])))"
        labels:
          slo: "certificate_freshness"
          window: "24h"
          sli_type: "freshness"
      - record: securityslo:certificate_freshness:error_ratio_rate3d
        expr: "1 - (avg(avg_over_time(bastion_tls_cert_valid[3d])))"
        labels:
          slo: "certificate_freshness"
          window: "3d"
          sli_type: "freshness"
      - record: securityslo:certificate_freshness:error_ratio_rate30d
        expr: "1 - (avg(avg_over_time(bastion_tls_cert_valid[30d])))"
        labels:
          slo: "certificate_freshness"
          window: "30d"
          sli_type: "freshness"
      # --- Burn-rate alerts ---
      - alert: SecuritySLOBurn_certificate_freshness_1h_Fast
        expr: "securityslo:certificate_freshness:error_ratio_rate1h > 0.0144 and securityslo:certificate_freshness:error_ratio_rate5m > 0.0144"
        for: 2m
        labels:
          severity: "page"
          slo: "certificate_freshness"
          team: "security"
          burn_rate: "14.4"
        annotations:
          summary: "Security SLO burn: Certificate Freshness is burning error budget 14.4x"
          description: "Over the last 1h (confirmed by the last 5m) the error ratio for Certificate Freshness exceeded 0.0144 (= 14.4x the 0.001 budget). At this rate ~2% of the 30d budget burns over the long window."
          runbook: "Investigate the Certificate Freshness security SLO. Bastion opens an incident on breach; follow the linked runbook."
      - alert: SecuritySLOBurn_certificate_freshness_6h_Fast
        expr: "securityslo:certificate_freshness:error_ratio_rate6h > 0.006 and securityslo:certificate_freshness:error_ratio_rate30m > 0.006"
        for: 2m
        labels:
          severity: "page"
          slo: "certificate_freshness"
          team: "security"
          burn_rate: "6"
        annotations:
          summary: "Security SLO burn: Certificate Freshness is burning error budget 6x"
          description: "Over the last 6h (confirmed by the last 30m) the error ratio for Certificate Freshness exceeded 0.006 (= 6x the 0.001 budget). At this rate ~5% of the 30d budget burns over the long window."
